<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커피리브레 아카이브</title>
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --ink:#2c2419; --muted:#8a7d6a;
    --line:#e8e0d4; --accent:#6f4e37; --accent-soft:#f0e9df; --chip:#efe7da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}

  /* 헤더 */
  header{
    background:linear-gradient(135deg,#6f4e37 0%,#4a3526 100%);
    color:#fff;padding:38px 0 30px;
  }
  header .wrap{display:flex;flex-direction:column;gap:14px}
  .title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:30px;font-weight:800;letter-spacing:-0.5px}
  .subtitle{font-size:14px;opacity:.82}
  .stats{display:flex;gap:22px;font-size:13px;opacity:.9;flex-wrap:wrap}
  .stats b{font-size:18px;font-weight:700;display:block}

  /* 검색바 */
  .searchbar{margin-top:6px;position:relative;max-width:520px}
  .searchbar input{
    width:100%;padding:13px 44px 13px 16px;border:none;border-radius:12px;
    font-size:15px;background:rgba(255,255,255,.95);color:var(--ink);
  }
  .searchbar input:focus{outline:2px solid #d6a679}
  .searchbar svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;opacity:.5}

  /* 카테고리 탭 */
  .cats{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:12px 0}
  .cats-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:thin}
  .cats-scroll::-webkit-scrollbar{height:5px}
  .cats-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .cat-chip{
    flex:0 0 auto;padding:8px 15px;border-radius:20px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;
    white-space:nowrap;transition:all .15s;font-weight:600;
  }
  .cat-chip:hover{border-color:var(--accent);color:var(--accent)}
  .cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cat-chip .n{opacity:.65;margin-left:5px;font-size:12px}

  /* 본문 */
  main{padding:24px 0 60px}
  .result-info{font-size:13px;color:var(--muted);margin-bottom:16px}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(111,78,55,.13)}
  .card-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--accent-soft);
    display:block}
  .card-img.placeholder{display:flex;align-items:center;justify-content:center;
    color:#c9bca8;font-size:32px}
  .card-body{padding:13px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--accent-soft);
    color:var(--accent);font-weight:600}
  .card-date{font-size:11px;color:var(--muted)}
  .card-ent{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35}
  .card-sum{font-size:12.5px;color:var(--muted);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  /* 더보기 */
  .loadmore{text-align:center;margin-top:30px}
  .loadmore button{
    padding:12px 32px;border:1px solid var(--accent);background:var(--surface);
    color:var(--accent);border-radius:24px;font-size:14px;cursor:pointer;font-weight:600;
  }
  .loadmore button:hover{background:var(--accent);color:#fff}

  /* 모달 */
  .modal{
    position:fixed;inset:0;background:rgba(44,36,25,.6);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal.open{display:flex}
  .modal-inner{
    background:var(--surface);border-radius:18px;max-width:620px;width:100%;
    max-height:88vh;overflow-y:auto;
  }
  .modal-img{width:100%;max-height:380px;object-fit:contain;background:#f4efe7;
    border-radius:18px 18px 0 0}
  .modal-content{padding:22px 26px 28px}
  .modal-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .modal-ent{font-size:20px;font-weight:800;margin-bottom:6px}
  .modal-body{font-size:14.5px;line-height:1.75;white-space:pre-wrap;color:#3a3020;
    margin:14px 0}
  .modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  .tag{font-size:12px;color:var(--accent);background:var(--accent-soft);
    padding:4px 10px;border-radius:10px}
  .modal-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;
    color:var(--accent);text-decoration:none;font-weight:600;margin-top:8px}
  .modal-close{position:sticky;top:12px;float:right;margin:12px 12px 0 0;
    width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.45);
    color:#fff;font-size:18px;cursor:pointer;z-index:2}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:15px}

  @media(max-width:600px){
    h1{font-size:24px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .card-body{padding:10px 12px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="title-row">
      <h1>☕ 커피리브레 아카이브</h1>
      <span class="subtitle">인스타그램 피드 기록 보관소</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="searchbar">
      <input type="text" id="search" placeholder="농장, 산지, 품종, 키워드로 검색…">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>
</header>

<div class="cats">
  <div class="wrap">
    <div class="cats-scroll" id="cats"></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="result-info" id="resultInfo"></div>
    <div class="grid" id="grid"></div>
    <div class="loadmore" id="loadmore" style="display:none">
      <button id="loadmoreBtn">더 보기</button>
    </div>
    <div class="loading" id="loading">데이터를 불러오는 중…</div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose">×</button>
    <img class="modal-img" id="modalImg" style="display:none">
    <div class="modal-content">
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-ent" id="modalEnt"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-tags" id="modalTags"></div>
      <a class="modal-link" id="modalLink" target="_blank" rel="noopener" style="display:none">
        인스타그램에서 보기 →
      </a>
    </div>
  </div>
</div>

<script>
const PAGE = 60;
let DATA = {categories:[], posts:[]};
let filtered = [];
let shown = 0;
let curCat = '전체';
let curSearch = '';

// ── 데이터 로드 (같은 폴더의 archive_data.json) ──
fetch('../archive_data.json')
  .then(r => r.json())
  .then(d => { DATA = d; init(); })
  .catch(e => {
    document.getElementById('loading').textContent =
      '데이터 파일(archive_data.json)을 찾을 수 없습니다. HTML과 같은 폴더에 함께 올려주세요.';
  });

function init(){
  document.getElementById('loading').style.display='none';
  // 통계
  document.getElementById('stats').innerHTML =
    `<span><b>${DATA.posts.length.toLocaleString()}</b>개 기록</span>`+
    `<span><b>${DATA.categories.length}</b>개 카테고리</span>`;
  // 카테고리 탭
  const catsEl = document.getElementById('cats');
  const all = `<div class="cat-chip active" data-cat="전체">전체<span class="n">${DATA.posts.length}</span></div>`;
  const chips = DATA.categories.map(c=>{
    const n = DATA.posts.filter(p=>p.cat===c).length;
    return `<div class="cat-chip" data-cat="${c}">${c}<span class="n">${n}</span></div>`;
  }).join('');
  catsEl.innerHTML = all + chips;
  catsEl.querySelectorAll('.cat-chip').forEach(ch=>{
    ch.onclick=()=>{
      catsEl.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('active'));
      ch.classList.add('active');
      curCat = ch.dataset.cat;
      applyFilter();
    };
  });
  // 검색
  let t;
  document.getElementById('search').oninput=(e)=>{
    clearTimeout(t);
    t=setTimeout(()=>{ curSearch=e.target.value.trim().toLowerCase(); applyFilter(); },200);
  };
  applyFilter();
}

function applyFilter(){
  filtered = DATA.posts.filter(p=>{
    if(curCat!=='전체' && p.cat!==curCat) return false;
    if(curSearch){
      const hay=(p.ent+' '+p.body+' '+p.sum+' '+p.tags.join(' ')).toLowerCase();
      if(!hay.includes(curSearch)) return false;
    }
    return true;
  });
  shown=0;
  document.getElementById('grid').innerHTML='';
  renderMore();
  document.getElementById('resultInfo').textContent =
    `${filtered.length.toLocaleString()}개 기록`+
    (curCat!=='전체'?` · ${curCat}`:'')+
    (curSearch?` · "${curSearch}" 검색`:'');
}

function renderMore(){
  const grid=document.getElementById('grid');
  const slice=filtered.slice(shown, shown+PAGE);
  const html=slice.map(p=>{
    const img = p.img
      ? `<img class="card-img" loading="lazy" src="data:image/jpeg;base64,${p.img}">`
      : `<div class="card-img placeholder">☕</div>`;
    return `<div class="card" data-id="${p.id}">
      ${img}
      <div class="card-body">
        <div class="card-meta">
          <span class="badge">${p.cat}</span>
          <span class="card-date">${p.date||''}</span>
        </div>
        <div class="card-ent">${esc(p.ent)}</div>
        <div class="card-sum">${esc(p.sum||p.body.slice(0,80))}</div>
      </div>
    </div>`;
  }).join('');
  grid.insertAdjacentHTML('beforeend', html);
  shown += slice.length;
  // 카드 클릭
  slice.forEach(p=>{
    const el=grid.querySelector(`.card[data-id="${p.id}"]`);
    if(el) el.onclick=()=>openModal(p);
  });
  // 더보기 버튼
  document.getElementById('loadmore').style.display =
    shown < filtered.length ? 'block':'none';
  if(filtered.length===0){
    grid.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
  }
}
document.getElementById('loadmoreBtn').onclick=renderMore;

function openModal(p){
  const m=document.getElementById('modal');
  const img=document.getElementById('modalImg');
  if(p.img){ img.src=`data:image/jpeg;base64,${p.img}`; img.style.display='block'; }
  else img.style.display='none';
  document.getElementById('modalMeta').innerHTML=
    `<span class="badge">${p.cat}</span><span class="card-date">${p.date||''}</span>`;
  document.getElementById('modalEnt').textContent=p.ent;
  document.getElementById('modalBody').textContent=p.body;
  document.getElementById('modalTags').innerHTML=
    p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const link=document.getElementById('modalLink');
  if(p.link && p.link.startsWith('http')){ link.href=p.link; link.style.display='inline-flex'; }
  else link.style.display='none';
  m.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modal').onclick=(e)=>{ if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeModal(); });

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>

</body>
</html>
